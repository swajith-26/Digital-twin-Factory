# Digital Twin Factory - Mosquitto broker (production settings)
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# No anonymous access: every device and service authenticates.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883
# For a real plant, ALSO terminate TLS here (listener 8883 + cafile/certfile/keyfile)
# and point devices at 8883. See docs/DEPLOYMENT.md.
