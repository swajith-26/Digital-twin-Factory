server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The dashboard and the API share one origin: no CORS, one URL to secure.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Server-Sent Events must not be buffered or cut off.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }

  # Put authentication here (basic auth / OIDC proxy) before exposing beyond a trusted LAN.
}
